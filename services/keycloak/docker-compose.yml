# Keycloak sits BEHIND the edge gateway at <public-url>/auth. That is what makes an
# HTTPS deployment possible at all: a browser on an https:// page may not call an
# http:// endpoint (mixed active content is blocked outright), so Keycloak cannot stay
# on a plain-HTTP :8009 once the portal is served over TLS. Putting it behind the
# gateway gives it the gateway's certificate and a single origin on 443 — no second
# cert, no extra port.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start                    # production mode (not start-dev): real DB, optimized
      - --http-enabled=true      # TLS terminates at the gateway; Keycloak serves HTTP behind it
      - --import-realm           # imports services/keycloak/import/*.json on FIRST boot only
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}

      # Context path (Keycloak 17+ serves at / by default; put /auth back for the gateway).
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/auth}

      # Trust the gateway's X-Forwarded-* so Keycloak emits https:// URLs + Secure cookies.
      KC_PROXY_HEADERS: xforwarded

      # Public address (the `iss` in every token). Must match PORTAL_KEYCLOAK_BASE_URL /
      # ORTHANC_KEYCLOAK_URL / KEYCLOAK_PUBLIC_URL. Includes /auth.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost/auth}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-true}

      # Persist to the shared platform Postgres (service `database`) — no embedded H2.
      # The `keycloak` role + DB are created by services/postgres/keycloak_init.sql.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "8009:8080"              # direct admin/debug access; normal traffic via the gateway /auth
    volumes:
      - ./import:/opt/keycloak/data/import
      - ./digitaltwins-login-theme:/opt/keycloak/themes/digitaltwins-login-theme:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - digitaltwins-platform

networks:
  digitaltwins-platform:
    driver: bridge
    name: ${PROJECT_NAME}
