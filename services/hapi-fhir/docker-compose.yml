services:
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir
    restart: on-failure          # retries until the shared `database` is up (no depends_on needed cross-include)
    ports:
      - "8013:8080"
    networks:
      - digitaltwins-platform
    volumes:
      - ./application.yaml:/app/config/application.yaml
      - ./HealthCheck.class:/app/HealthCheck.class:ro
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - SPRING_CONFIG_LOCATION=/app/config/application.yaml
      # Use the shared platform Postgres (service `database`) instead of a dedicated
      # postgres:13 container. HAPI connects as the admin superuser; the `hapi` DB is
      # created by services/postgres/hapi_init.sql. These env vars override the
      # datasource block in application.yaml (Spring: env wins over file).
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/hapi
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-admin}

networks:
  digitaltwins-platform:
    driver: bridge
    name: ${PROJECT_NAME}
