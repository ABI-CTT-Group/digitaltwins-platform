services:
  gateway:
    # nginx 1.30.3-alpine — the current stable release, pinned to an exact version.
    image: nginx:1.30.3-alpine
    container_name: ${PROJECT_NAME}-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_MODE (root .env) selects the server shell: `http` or `ssl`. Docker picks
      # the directory — that is what replaced the if-statement in the portal's old
      # entry.sh. The routes themselves are shared by both shells via snippets/.
      - ./conf/${NGINX_MODE:-http}:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      # Certs live with the only service that reads them.
      - ./certs:/etc/nginx/certs:ro
      # ACME HTTP-01 webroot: certbot (util/renew-cert.sh) drops challenge files
      # here on the host; the port-80 server block serves them so Let's Encrypt
      # can validate the domain WITHOUT taking the gateway down. Read-only in the
      # container — only certbot on the host writes.
      - ./acme:/var/www/certbot:ro
    healthcheck:
      # `/` 301-redirects to https://127.0.0.1/ (the http shell always redirects to
      # https), and wget --spider FOLLOWS redirects by default -- so without
      # --no-check-certificate this always fails: the gateway's cert is issued for
      # the real public domain, not the literal string "127.0.0.1", so TLS
      # verification rejects it and wget exits 1. That made this container report
      # unhealthy on every single boot regardless of whether it actually worked
      # (confirmed live: nginx served real, correctly-Host-headed requests fine the
      # whole time). This is a loopback self-check, not a real client connection --
      # skipping cert verification here doesn't weaken anything external.
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    extra_hosts:
      # Reach the k3s Traefik (observability stack) on the host node's real IP —
      # NOT the docker bridge gateway (the k3s CNI hostport DNAT only masquerades
      # bridge/localhost sources, so a bridge-IP:81 connection hangs). NODE_IP is
      # rendered into .env by gen-env.sh (defaults to 127.0.0.1 when unset).
      - "k3s-node:${NODE_IP}"
    networks:
      digitaltwins-platform:
        aliases:
          # Let platform containers reach the public hostname internally (they
          # resolve it to THIS gateway container, which serves /auth -> Keycloak
          # with the trusted cert). Fixes SEEK's interactive OIDC login, whose
          # back-channel would otherwise hairpin to an unreachable host-gateway
          # (docker0 172.17.0.1) from the 172.18.x bridge under ufw deny.
          # NOTE: also requires dropping SEEK's `extra_hosts: <domain>:host-gateway`
          # in the ldh-deployment submodule — an /etc/hosts entry shadows this alias.
          - "${PLATFORM_DOMAIN:-localhost}"
