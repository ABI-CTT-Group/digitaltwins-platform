services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    depends_on:
      - gateway
    ports:
      - '8011:9000' #api
      - '8012:9001' # web gui
    networks:
      - digitaltwins-platform
    volumes:
      - 'minio_data:/data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SERVER_ACCESS_KEY=${MINIO_SERVER_ACCESS_KEY:-minioadmin}
      - MINIO_SERVER_SECRET_KEY=${MINIO_SERVER_SECRET_KEY:-minioadmin}
      # Tells the Console its public base URL so all static/API/redirect paths get the /minio prefix.
      # Filled from .env (see .env.template). HTTP default is used only when unset.
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-http://localhost/minio}
      - MINIO_IDENTITY_OPENID_ENABLE=on
      - MINIO_IDENTITY_OPENID_DISPLAY_NAME=Keycloak
      - MINIO_IDENTITY_OPENID_CONFIG_URL=${MINIO_OIDC_CONFIG_URL}
      - MINIO_IDENTITY_OPENID_CLIENT_ID=minio
      - MINIO_IDENTITY_OPENID_CLIENT_SECRET=${MINIO_KEYCLOAK_CLIENT_SECRET}
      - MINIO_IDENTITY_OPENID_SCOPES=openid,profile,email
      - MINIO_IDENTITY_OPENID_CLAIM_NAME=policy
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./init-minio.sh:/init-minio.sh:ro
    entrypoint: /bin/sh /init-minio.sh
    networks:
      - digitaltwins-platform

volumes:
  minio_data:
    driver: local
    name: ${PROJECT_NAME}_minio_data

networks:
  digitaltwins-platform:
    driver: bridge
    name: ${PROJECT_NAME}
