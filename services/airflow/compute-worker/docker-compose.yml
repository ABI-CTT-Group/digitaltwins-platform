---
# Remote Airflow compute node — a single Celery worker that joins the portal's
# Airflow cluster over the VLAN. It runs NO control plane; scheduler, apiserver,
# Postgres, Redis and MinIO all live on the portal and are reached at ${MAIN_VM_IP}.
#
# Config comes from a sibling `.env` produced by `util/generate-compute-env.sh`
# (which reads the running platform's .env), so the shared secrets — FERNET_KEY,
# REDIS_PASSWORD, DB + MinIO creds — match the portal automatically.
#
# Which queue(s) this node serves is set by WORKER_QUEUES in that .env, e.g.
# WORKER_QUEUES=gpu. Tasks tagged `queue="gpu"` in a DAG then run here.
services:
  airflow-worker:
    image: digitaltwins-platform-airflow-worker:latest
    command: celery worker -q ${WORKER_QUEUES:-default}
    # DAG tasks reach Keycloak (token issuer) by the portal's PUBLIC DOMAIN, so
    # the container must resolve that domain to the portal over the VLAN. The
    # host's /etc/hosts entry does NOT reach inside the container — map it here.
    extra_hosts:
      - "${PLATFORM_DOMAIN}:${MAIN_VM_IP}"
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      # --- reach the portal's control plane over the VLAN -------------------
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@${MAIN_VM_IP}:${AIRFLOW_POSTGRES_PORT}/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD}@${MAIN_VM_IP}:${AIRFLOW_POSTGRES_PORT}/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@${MAIN_VM_IP}:${REDIS_PORT}/0
      # Execution API over the VLAN (direct port) — this is a machine-to-machine
      # API, keep it INTERNAL, never the public gateway. The direct port must be
      # opened in the cloud security group RESTRICTED to this node's private IP.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://${MAIN_VM_IP}:${AIRFLOW_PORT}/airflow/execution/
      # --- shared secrets (must equal the portal's) ------------------------
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set in the node .env (same as platform)}
      # NOTE: Airflow 3 worker<->apiserver (execution API) auth uses a JWT secret.
      # The platform does NOT set AIRFLOW__API_AUTH__JWT_SECRET explicitly today, so
      # nothing is set here either. If a remote worker fails to authenticate to the
      # execution API at runtime, set the SAME AIRFLOW__API_AUTH__JWT_SECRET on BOTH
      # the portal and this node (a new shared secret, like FERNET_KEY). Verify live.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
      # Required for clean warm-shutdown of celery workers
      # https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
      # --- services the child workflow_* DAG tasks call, also over the VLAN ---
      # Orchestration (fetch configs, discover samples, trigger the child
      # workflow_{seek_id} runs) now lives in the DigitalTWINS API on the portal,
      # not in a preprocessor DAG here — so the worker no longer needs
      # AIRFLOW_ENDPOINT. It just runs the child DAG tasks, which call the
      # DigitalTWINS API and MinIO over the VLAN.
      # The task builds the DigitalTWINS API URL as base + ":" + DIGITALTWINS_API_PORT,
      # so the base must NOT carry a port (else it doubles, e.g. host:8010:8010).
      # Pass the port separately; the task appends it. (Over the VLAN the API is on
      # the published 8010, not the internal 8000.)
      DIGITALTWINS_API_BASE_URL: http://${MAIN_VM_IP}
      DIGITALTWINS_API_PORT: ${DIGITALTWINS_API_PORT}
      MINIO_ENDPOINT: http://${MAIN_VM_IP}:${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_SERVER_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SERVER_SECRET_KEY}
      # --- Keycloak (token issuer for DAG -> platform-API auth) ------------
      # Via the PUBLIC gateway URL — the internal 'keycloak' hostname is
      # unreachable off-box, and this is the canonical token issuer. Reached at
      # https://<domain>/auth over the VLAN (gateway 443, already open); the node
      # must resolve <domain> to the portal (public DNS or an /etc/hosts entry).
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-digitaltwins}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in the node .env (same as platform)}
      # --- task logs -> the portal's MinIO airflow-logs bucket -------------
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'True'
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_logs
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs
      AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: 'False'
      AIRFLOW_CONN_MINIO_LOGS: "aws://${MINIO_SERVER_ACCESS_KEY}:${MINIO_SERVER_SECRET_KEY}@?endpoint_url=http%3A%2F%2F${MAIN_VM_IP}%3A${MINIO_PORT}"
    volumes:
      # synced from the portal (rsync services/airflow/{dags,config,plugins,data})
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    restart: always
    # --- GPU access -------------------------------------------------------
    # On a GPU node (NVIDIA driver + nvidia-container-toolkit installed),
    # uncomment to give the worker the GPU(s). Only needed if the task code
    # runs in-process in the worker; a task that spawns its own container
    # (e.g. DockerOperator) puts the GPU flags on THAT container instead.
    # gpus: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
