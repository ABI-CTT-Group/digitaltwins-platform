# Unit-test gate. Every job calls a Makefile target, so `make <target>` reproduces it locally.
# See docs/testing.md and docs/decisions/2026-10-16-ci-make-in-pinned-containers.md.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which suites a PR touches. Pushes to main and manual runs test everything.
  # Draft PRs skip this job, and with it every job below.
  changes:
    name: detect changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      builder: ${{ steps.filter.outputs.builder }}
      frontend: ${{ steps.filter.outputs.frontend }}
      jupyterhub: ${{ steps.filter.outputs.jupyterhub }}
      util: ${{ steps.filter.outputs.util }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            files="Makefile"
          else
            files=$(git diff --name-only "$BASE...$HEAD")
          fi
          printf 'Changed files:\n%s\n' "$files"
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          all=$(has '^(Makefile|\.github/workflows/)')
          api=$(has '^services/(api|postgres)/')
          # The builder's tests also read the portal-frontend nginx template, the root and API
          # compose files (the Docker socket and environment split) and the API's migration runner and
          # Keycloak verifier (the builder's copies must match them).
          builder=$(has '^services/builder/|^services/portal/frontend/nginx\.conf\.template$|^docker-compose\.yml$|^services/api/docker-compose\.yml$|^services/api/src/digitaltwins/postgres/migration_runner\.py$|^services/api/src/digitaltwins/core/keycloak_verifier\.py$')
          frontend=$(has '^services/portal/frontend/')
          jupyterhub=$(has '^services/jupyterhub/')
          util=$(has '^util/|^services/airflow/(docker-compose|gpu\.override)\.yml$')
          [ "$all" = true ] && api=true builder=true frontend=true jupyterhub=true util=true
          code=false
          for v in $api $builder $frontend $jupyterhub; do [ "$v" = true ] && code=true; done
          {
            echo "api=$api"
            echo "builder=$builder"
            echo "frontend=$frontend"
            echo "jupyterhub=$jupyterhub"
            echo "util=$util"
            echo "code=$code"
          } | tee -a "$GITHUB_OUTPUT"

  # Job names are the required-check names on main; don't rename them.
  api:
    name: api unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-api

  builder:
    name: builder unit tests
    needs: changes
    if: needs.changes.outputs.builder == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-builder

  frontend:
    name: frontend unit tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-frontend

  jupyterhub:
    name: jupyterhub unit tests
    needs: changes
    if: needs.changes.outputs.jupyterhub == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-jupyterhub

  util:
    name: util unit tests
    needs: changes
    if: needs.changes.outputs.util == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-util

  # Report-only: continue-on-error is on the steps so the job stays green while findings still show.
  lint:
    name: lint (report-only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-python RUFF_FORMAT=github
        continue-on-error: true
      - run: make lint-frontend
        continue-on-error: true

  # Scans only this PR's commits: the public history predates the pre-commit hook.
  gitleaks:
    name: gitleaks (PR commits)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make gitleaks GITLEAKS_RANGE="$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
